name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify release and run safety tests
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          test "$(bin/easydd --version)" = "easydd $(cat VERSION)"
          make check test
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "easydd $GITHUB_REF_NAME" \
            --notes 'A macOS image writer with an external-disk picker, startup/source disk protection, exact-path confirmation, a progress bar, and mocked safety tests. See the README for Homebrew installation. Writing erases all data on the selected disk.'
